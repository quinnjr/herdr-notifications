[package]
name = "herdr-notifications"
version = "0.2.0"
edition = "2024"
description = "Relays herdr agent-status events to native OS desktop notifications (Linux, macOS, Windows, BSD)."
license = "MIT"
repository = "https://github.com/quinnjr/herdr-notifications"
readme = "README.md"
keywords = ["herdr", "notifications", "plugin", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "herdr-notifications"
path = "src/main.rs"

[dependencies]
notify-rust = { version = "4", default-features = false, features = ["z"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
