id = "quinnjr.herdr-notifications"
name = "herdr-notifications"
version = "0.2.0"
min_herdr_version = "0.7.0" # 0.7 bare event JSON + 0.8 {event,data} envelope both supported
description = "Relays herdr agent-status changes (blocked/done) to native OS desktop notifications on Linux, macOS, and Windows (also builds and runs on BSD)."
# herdr's plugin platform enum only knows linux/macos/windows; the underlying
# binary is plain Rust + notify-rust and also builds/runs on the BSDs.
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "build", "--release"]

# Fires whenever an agent's status flips (idle/working/blocked/done/unknown).
# The binary itself decides what's worth surfacing (blocked + done only) and
# dedupes so repeat events for an unchanged status don't re-notify.
[[events]]
on = "pane.agent_status_changed"
command = ["target/release/herdr-notifications", "event"]

# Manual smoke test: confirms the OS notification backend and permissions
# are working without waiting for a real agent-status change.
[[actions]]
id = "test-notification"
title = "herdr-notifications: send test notification"
contexts = ["workspace"]
command = [
  "target/release/herdr-notifications",
  "notify",
  "--title",
  "herdr",
  "--body",
  "Notifications are working.",
  "--sound",
  "done",
]
